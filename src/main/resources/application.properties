# Spring Application Name
spring.application.name=SafeStep Platform

# Default to development when no explicit profile is provided.
spring.profiles.default=dev

# Shared Spring DataSource Configuration
spring.datasource.driver-class-name=org.postgresql.Driver

# Shared Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.naming.physical-strategy=com.safestep.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Application Information for Documentation

# Elements take their values from maven pom.xml build-related information
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# JWT Configuration Properties
authorization.jwt.secret=${JWT_SECRET:WriteHereYourSecretStringForTokenSigningCredentials}
authorization.jwt.expiration.days=7
authorization.jwt.refresh.expiration.days=30
authorization.password-reset.expiration.minutes=30

# Stripe Checkout Configuration
stripe.secret.key=${STRIPE_SECRET_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
stripe.currency=${STRIPE_CURRENCY:usd}
stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:4200/payment/success}
stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:4200/payment/cancel}

# Initial admin bootstrap seed — OPTIONAL, only used once at first startup.
# Set both env vars to create the first ROLE_ADMIN user if none exists yet.
# Safe to leave unset in every environment after the first admin exists.
safestep.admin-seed.username=${SAFESTEP_ADMIN_USERNAME:}
safestep.admin-seed.password=${SAFESTEP_ADMIN_PASSWORD:}

# CORS: origins allowed to call the API from a browser (comma separated). Override with SAFESTEP_CORS_ALLOWED_ORIGINS.
safestep.cors.allowed-origins=${SAFESTEP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,https://upc-1asi0729-2610-11990-chronos-team-3.github.io,https://1asi0732-2620-9090-grupo-4.github.io}

# i18n message bundles
spring.messages.basename=messages
spring.messages.encoding=UTF-8
