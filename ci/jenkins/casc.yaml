jenkins:
  systemMessage: "SafeStep CI - configured as code (ci/jenkins/casc.yaml)"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: true   # local CI: dashboards are readable, building still needs the admin user

unclassified:
  location:
    url: "http://localhost:9089/"
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "MiSonarServer"
        serverUrl: "http://sonarqube-server:9000"
        credentialsId: "sonarqube-token-id"

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "sonarqube-token-id"
              description: "Token de autenticacion para SonarQube"
              secret: "${SONAR_TOKEN}"
          # Docker Hub access token used by the pipeline to publish the application image. The values come from
          # ci/.env (git-ignored): DOCKER_HUB_USER and DOCKER_HUB_TOKEN
          - usernamePassword:
              scope: GLOBAL
              id: "DOCKER_HUB_CREDENTIALS"
              description: "Docker Hub access token"
              username: "${DOCKER_HUB_USER:-}"
              password: "${DOCKER_HUB_TOKEN:-}"

jobs:
  - script: >
      pipelineJob('safestep-backend') {
        description('SafeStep backend CI: build, checkstyle, unit and BDD tests, coverage gate, SonarQube and package.')
        definition {
          cpsScm {
            scm {
              git {
                remote { url('file:///workspace/safestept-backend') }
                branches('*/main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(false)
          }
        }
      }
